<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>archan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFD84D; --blue:#38BDF8; --pink:#7C5CFF; --violet:#7C5CFF; --green:#34C77A;
  }
  html,body{
    margin:0; height:100%; overflow:hidden;
    font-family:'Poppins',sans-serif;
  }
  body{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:#0a0a0a;
  }

  /* video background layers, crossfaded by percentage */
  .bg{
    position:absolute; inset:0; overflow:hidden;
  }
  .bg-video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1s ease;
  }
  .bg-video.active{ opacity:1; }

  .bg-overlay{
    position:absolute; inset:0;
    background:rgba(10,10,10,.55);
  }

  /* percentage numeral, liquid-fill style */
  .pct-wrap{
    position:relative; z-index:2;
    font-weight:800; font-size:19vw; line-height:1; letter-spacing:-.02em;
    width:min(760px, 90vw); text-align:center;
  }
  .pct{
    position:relative; display:inline-block;
  }
  .pct-outline, .pct-fill{
    display:block; user-select:none;
  }
  .pct-outline{
    color:transparent;
    -webkit-text-stroke:2px rgba(255,255,255,.85);
  }
  .pct-fill{
    position:absolute; inset:0;
    color:#fff;
    -webkit-text-stroke:2px rgba(255,255,255,.85);
    clip-path:inset(100% 0 0 0);
  }

  .brand-tag{
    position:relative; z-index:2;
    text-align:center; margin-top:6px;
    font-family:'Caveat',cursive; font-weight:700; font-size:1.4rem; color:rgba(255,255,255,.92);
    opacity:0; transform:translateY(8px);
    animation:tagIn .5s ease forwards; animation-delay:.4s;
  }
  @keyframes tagIn{ to{ opacity:1; transform:translateY(0); } }

  .mark{
    position:absolute; right:34px; bottom:30px; z-index:2;
    width:52px; height:52px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.75);
    display:flex; align-items:center; justify-content:center;
    font-family:'Caveat',cursive; font-weight:700; font-size:1.3rem; color:#fff;
    animation:spinMark 6s linear infinite;
  }
  @keyframes spinMark{ to{ transform:rotate(360deg); } }
  .mark span{ display:inline-block; animation:counterSpin 6s linear infinite reverse; }
  @keyframes counterSpin{ to{ transform:rotate(-360deg); } }

  @media (prefers-reduced-motion: reduce){
    .brand-tag{ animation:none; opacity:1; transform:none; }
    .mark, .mark span{ animation:none; }
  }
</style>
</head>
<body>
  <div class="bg">
    <video class="bg-video active" id="v1" src="green.mp4" autoplay muted loop playsinline></video>
    <video class="bg-video" id="v2" src="skyblue.mp4" autoplay muted loop playsinline></video>
    <video class="bg-video" id="v3" src="tech.mp4" autoplay muted loop playsinline></video>
    <div class="bg-overlay"></div>
  </div>

  <div>
    <div class="pct-wrap">
      <div class="pct">
        <span class="pct-outline" id="pctOutline">0%</span>
        <span class="pct-fill" id="pctFill">0%</span>
      </div>
    </div>
    <div class="brand-tag">archan — portfolio loading</div>
  </div>

  <div class="mark"><span>a</span></div>

  <script>
    const outlineEl = document.getElementById('pctOutline');
    const fillEl = document.getElementById('pctFill');
    const v1 = document.getElementById('v1');
    const v2 = document.getElementById('v2');
    const v3 = document.getElementById('v3');

    // which video is active by percentage: 0-30% v1, 30-75% v2, 75-100% v3
    function videoAt(p){
      if(p < 30) return v1;
      if(p < 75) return v2;
      return v3;
    }
    let currentVideo = v1;

    const DURATION = 3200;
    const start = performance.now();

    function frame(now){
      const elapsed = now - start;
      const p = Math.min(100, Math.round((elapsed / DURATION) * 100));

      outlineEl.textContent = p + '%';
      fillEl.textContent = p + '%';
      fillEl.style.clipPath = `inset(${100 - p}% 0 0 0)`;

      const target = videoAt(p);
      if(target !== currentVideo){
        currentVideo.classList.remove('active');
        target.classList.add('active');
        target.currentTime = 0;
        target.play().catch(()=>{});
        currentVideo = target;
      }

      if(p < 100){
        requestAnimationFrame(frame);
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
